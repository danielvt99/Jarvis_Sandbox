# CI/CD for the shop sample.
#   every pull request, and every JARVIS branch (started by the JARVIS fix workflow):  test
#   every push to main (that is, every merge):                                         test, then deploy
#
# So "merge from the phone" ships, and "revert from the phone" ships the previous code again.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q

  deploy:
    # Only main is ever deployed, and only when its tests pass.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package the release
        run: |
          mkdir -p dist
          tar -czf "dist/shop-${GITHUB_SHA::7}.tar.gz" services
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: shop-${{ env.version }}
          path: dist/
          retention-days: 14
      - name: Deploy
        run: |
          # STAND-IN. The sample has nowhere to run, so "deploying" is publishing the package above.
          # Replace this step with the real command for a real app (for example
          # `az webapp deploy` or `az containerapp update`); everything before it stays the same.
          echo "### Deployed shop ${version} (stand-in: packaged as a build artifact)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
