# JARVIS emergency fix on a GitHub-hosted runner (decision 032, option L-B: feasibility test).
#
# Start it from the phone, with the laptop off, in either way:
#   - add the label  jarvis:fix  to an issue (GitHub mobile app: open the issue, Labels), or
#   - Actions > "JARVIS fix" > Run workflow, and type the issue number.
# It ends with a DRAFT pull request from a jarvis/* branch. It never pushes to main and
# never merges; you review and merge in the GitHub app.
#
# One-time repository setting this needs:
#   Settings > Actions > General > Workflow permissions >
#   tick "Allow GitHub Actions to create and approve pull requests"
name: JARVIS fix

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to fix
        required: true
        type: number

# Least privilege for the job's token: read the issue, push one branch, open one pull request.
permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: jarvis-fix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'jarvis:fix'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # A number from the event, never free text: safe to use in commands below.
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
      JARVIS_MODEL: llama3.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false      # the token is NOT left in .git/config for later steps to find

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the issue (the only step before the end that holds the token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue view "$ISSUE_NUMBER" --json number,title,body > "$RUNNER_TEMP/issue.json"

      - name: Start the local model engine on this runner
        run: |
          started=$(date +%s)
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version > /dev/null && break; sleep 2; done
          docker exec ollama ollama pull "$JARVIS_MODEL"
          echo "| engine start and model download | $(( $(date +%s) - started )) s |" >> "$RUNNER_TEMP/setup_timing"
          nproc; free -g | head -2

      - name: Write the fix and run the tests (no token in this step)
        env:
          ISSUE_FILE: ${{ runner.temp }}/issue.json
          JARVIS_OUT: ${{ runner.temp }}/jarvis-out
        run: |
          python -m pip install --quiet pytest
          python .github/jarvis/fix_issue.py

      - name: Push the jarvis/* branch and open a draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/jarvis-out
        run: |
          branch="jarvis/${ISSUE_NUMBER}-runner-${GITHUB_RUN_ID}"
          target="$(cat "$OUT/target")"
          cat "$RUNNER_TEMP/setup_timing" >> "$OUT/pr_body.md"
          git checkout -b "$branch"
          git add -- "$target"
          git -c user.name="JARVIS (runner)" -c user.email="jarvis@users.noreply.github.com" \
              commit -m "$(cat "$OUT/title")" -m "Drafted by JARVIS on a GitHub-hosted runner. Refs #${ISSUE_NUMBER}."
          gh auth setup-git
          git push origin "$branch"
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "$(cat "$OUT/title")" --body-file "$OUT/pr_body.md"
